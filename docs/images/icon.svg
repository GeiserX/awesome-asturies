<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="256" height="256" role="img" aria-label="Awesome Asturies">
  <!-- The favicon: the same cider glass and stream as logo.svg, on a plate in
       the banner's darkest sky stop (#0a0a0f), with the banner's own amber glow
       (#e0a23a, the blurred ellipse behind the glass) as a soft light behind the
       glass. The stream runs from the top edge of the plate into the glass.
       Ids carry an aw- prefix. -->
  <defs>
    <clipPath id="aw-icon-plate"><rect width="360" height="360" rx="72"/></clipPath>
    <radialGradient id="aw-icon-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e0a23a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e0a23a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aw-icon-stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d27a"/><stop offset="100%" stop-color="#d99a2b"/>
    </linearGradient>
    <linearGradient id="aw-icon-cider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2c75c"/><stop offset="100%" stop-color="#c7801f"/>
    </linearGradient>
  </defs>
  <rect width="360" height="360" rx="72" fill="#0a0a0f"/>
  <g clip-path="url(#aw-icon-plate)">
    <g transform="translate(-190.6 -357.6) scale(3.4)">
      <circle cx="111" cy="168" r="44" fill="url(#aw-icon-glow)"/>
      <path d="M112 44 C 116 76, 118 112, 119 150" fill="none" stroke="url(#aw-icon-stream)" stroke-width="4" stroke-linecap="round"/>
      <g transform="rotate(-10 112 168)">
        <path d="M88 136 L134 136 L130 190 L92 190 Z" fill="#ffffff" opacity="0.14"/>
        <path d="M91.3 172 L130.7 172 L130 190 L92 190 Z" fill="url(#aw-icon-cider)" opacity="0.92"/>
        <path d="M91 169 Q111 164 131 169 L130.8 174 Q111 169 91.3 174 Z" fill="#fff1c8" opacity="0.9"/>
        <path d="M88 136 L92 190 L130 190 L134 136" fill="none" stroke="#e6e3da" stroke-width="3" stroke-linejoin="round" opacity="0.75"/>
        <path d="M88 136 L134 136" stroke="#e6e3da" stroke-width="2.5" opacity="0.5"/>
        <path d="M93 144 L96 184" stroke="#ffffff" stroke-width="1.8" opacity="0.22"/>
        <rect x="91" y="189" width="40" height="3.5" rx="1" fill="#e6e3da" opacity="0.55"/>
      </g>
      <g fill="#f6dc8e">
        <circle cx="113" cy="156" r="1.3" opacity="0.8"/><circle cx="126" cy="153" r="1" opacity="0.7"/>
        <circle cx="108" cy="160" r="0.9" opacity="0.6"/><circle cx="129" cy="160" r="0.9" opacity="0.6"/>
        <circle cx="117" cy="150" r="0.8" opacity="0.6"/>
      </g>
    </g>
  </g>
</svg>
