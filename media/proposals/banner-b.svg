<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <clipPath id="b-clip"><rect width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="b-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/><stop offset="70%" stop-color="#14141f"/><stop offset="100%" stop-color="#231a24"/>
    </linearGradient>
    <linearGradient id="b-lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd6ac"/><stop offset="40%" stop-color="#ee9d5e"/><stop offset="85%" stop-color="#b65a38"/><stop offset="100%" stop-color="#6e3a2c"/>
    </linearGradient>
    <linearGradient id="b-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5654"/><stop offset="100%" stop-color="#2b2229"/>
    </linearGradient>
    <linearGradient id="b-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#565a66"/><stop offset="100%" stop-color="#262731"/>
    </linearGradient>
    <linearGradient id="b-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30313a"/><stop offset="100%" stop-color="#16161d"/>
    </linearGradient>
    <filter id="b-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="b-soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <g clip-path="url(#b-clip)">
    <rect width="800" height="200" fill="url(#b-bg)"/>
    <ellipse cx="690" cy="90" rx="170" ry="110" fill="#e07a45" opacity="0.18" filter="url(#b-blur)"/>
    <ellipse cx="120" cy="30" rx="200" ry="90" fill="#5a6f9a" opacity="0.10" filter="url(#b-blur)"/>
    <rect width="800" height="2" fill="#e08a4f" opacity="0.7"/>

    <!-- estrellas -->
    <g fill="#ffffff">
      <circle cx="62" cy="34" r="0.9" opacity="0.5"/><circle cx="118" cy="62" r="0.7" opacity="0.35"/>
      <circle cx="176" cy="22" r="1" opacity="0.45"/><circle cx="96" cy="100" r="0.7" opacity="0.3"/>
      <circle cx="600" cy="20" r="0.8" opacity="0.4"/><circle cx="760" cy="26" r="1" opacity="0.45"/>
      <circle cx="642" cy="48" r="0.7" opacity="0.3"/><circle cx="210" cy="84" r="0.7" opacity="0.3"/>
      <circle cx="30" cy="70" r="0.8" opacity="0.35"/><circle cx="780" cy="70" r="0.7" opacity="0.3"/>
    </g>

    <!-- cordales lejanos de los Picos de Europa -->
    <path d="M0 150 L28 138 L44 144 L70 124 L88 132 L112 118 L130 130 L150 126 L176 140 L200 134 L232 148 L260 142 L300 152 L340 146 L380 154 L430 148 L470 140 L500 146 L530 132 L556 138 L584 120 L604 128 L630 112 L652 122 L664 116 L740 118 L760 108 L780 118 L800 112 L800 200 L0 200 Z" fill="url(#b-far)" opacity="0.9"/>

    <!-- crestas de caliza -->
    <path d="M44 144 L70 124 L88 132 M112 118 L130 130 M530 132 L556 138 M584 120 L604 128 M630 112 L652 122" fill="none" stroke="#9aa0ad" stroke-width="1" opacity="0.35"/>

    <!-- Picu Urriellu -->
    <g transform="translate(8,0)">
      <ellipse cx="700" cy="84" rx="76" ry="56" fill="#f09a5a" opacity="0.22" filter="url(#b-soft)"/>
      <!-- hombro norte -->
      <path d="M576 160 L594 142 L610 148 L624 132 L644 160 Z" fill="#4a3a3e"/>
      <!-- cara oeste, al sol -->
      <path d="M618 160 L630 118 L642 84 L656 58 L668 44 L680 36 L692 40 L700 160 Z" fill="url(#b-lit)"/>
      <!-- cara este, en sombra -->
      <path d="M692 40 L704 38 L714 48 L724 76 L734 106 L748 130 L766 148 L780 160 L700 160 Z" fill="url(#b-shade)"/>
      <g stroke="#8a4630" stroke-width="1" opacity="0.4" fill="none">
        <path d="M640 122 L658 74"/>
        <path d="M652 152 L670 104 L676 62"/>
        <path d="M684 150 L688 92 L684 46"/>
      </g>
      <g stroke="#ffe0bf" stroke-width="0.8" opacity="0.28" fill="none">
        <path d="M632 116 L698 110"/><path d="M646 78 L698 74"/>
      </g>
      <g stroke="#3a2a30" stroke-width="1" opacity="0.5" fill="none">
        <path d="M712 60 L728 112 L750 138"/>
      </g>
      <path d="M656 58 L668 44 L680 36 L692 40 L704 38 L714 48" fill="none" stroke="#ffe2c4" stroke-width="1.4" opacity="0.85"/>
    </g>

    <!-- cordal medio -->
    <path d="M0 176 L40 164 L66 170 L96 156 L120 164 L150 158 L190 170 L240 166 L290 176 L350 170 L410 178 L470 170 L520 174 L570 160 L610 150 L640 144 L662 150 L690 158 L720 154 L750 142 L776 150 L800 146 L800 200 L0 200 Z" fill="url(#b-mid)"/>
    <!-- valle -->
    <path d="M0 192 Q120 180 240 188 Q380 196 520 186 Q640 178 800 184 L800 200 L0 200 Z" fill="#0f0d12"/>

    <text x="400" y="78" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" fill="#ffffff" font-weight="700" letter-spacing="0.5">awesome-asturies</text>
    <rect x="340" y="92" width="120" height="2" rx="1" fill="#e08a4f" opacity="0.8"/>
    <text x="400" y="118" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" font-weight="400" letter-spacing="2.4">SOFTWARE OPEN SOURCE PAL PRINCIPAU D'ASTURIES</text>
  </g>
</svg>
